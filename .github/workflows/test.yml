name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Use the Chrome binary included in the GitHub-hosted runner image.
      - run: CHROMIUM_PATH="$(command -v google-chrome)" npm run test:browser
